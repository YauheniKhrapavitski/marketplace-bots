services:
  web:
    build: .
    env_file:
      - .env
    command: sh -c "npx prisma migrate deploy && npm start"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cutter_cabinets
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - cutter_cabinets_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cutter_cabinets"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cutter_cabinets_data:
